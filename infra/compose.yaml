
services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER obrigatorio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatorio}
      POSTGRES_DB: ${DB_NAME:?DB_NAME obrigatorio}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wagering"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: