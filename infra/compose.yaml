
services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER obrigatorio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatorio}
      POSTGRES_DB: ${DB_NAME:?DB_NAME obrigatorio}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wagering"]
      interval: 5s
      timeout: 3s
      retries: 10

  ministack:
    image: ${MINISTACK_IMAGE:-ministackorg/ministack:1.5.36}
    restart: unless-stopped
    environment:
      SERVICES: sqs
      MINISTACK_REGION: us-east-1
      MINISTACK_ACCOUNT_ID: "000000000000"
      PERSIST_STATE: "1"
      STATE_DIR: /var/lib/ministack
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - sqs_data:/var/lib/ministack
      - ./init-sqs.sh:/etc/localstack/init/ready.d/10-init-sqs.sh:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  sqs_data:
